  /api/v2/appointments/:
    get:
      operationId: appointments_list
      description: List appointments with filters
      summary: List appointments
      parameters:
      - in: query
        name: appointment_date_after
        schema:
          type: string
          format: date
        description: Filter by appointment date range
      - in: query
        name: appointment_date_before
        schema:
          type: string
          format: date
        description: Filter by appointment date range
      - in: query
        name: appointment_type
        schema:
          type: string
        description: Filter by appointment type
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: patient
        schema:
          type: integer
        description: Filter by patient ID
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: specialist
        schema:
          type: integer
        description: Filter by specialist ID
      - in: query
        name: status
        schema:
          type: string
        description: Filter by appointment status
      tags:
      - Appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointmentListPaginatedList'
          description: Paginated successful response
        '401':
          content:
            application/json:
