          minimum: 5
          description: 'Standard duration of this service in minutes (minimum: 5)'
        base_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Standard price for this service before any specialist overrides
        is_active:
          type: boolean
          default: true
          description: Whether this service is available for assignment to specialists
      required:
